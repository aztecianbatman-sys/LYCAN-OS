<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LYCAN OS</title></head>
<body>
<div id="scene" class="scene">
  <div class="aurora"></div><div class="grain"></div>
  <header class="hud"><div class="brand-mini"><span class="brand-mark">◈</span><span>LYCAN</span><i>1.0</i></div><div class="hud-right"><span id="vmState">CONNECTING</span><span class="hud-sep"></span><span id="clock">--:--</span></div></header>

  <section class="core" id="core">
    <div class="halo halo-a"></div><div class="halo halo-b"></div><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div>
    <button id="logo" class="logo-core" aria-label="LYCAN home"><span class="wolf">◈</span><span class="logo-word">LYCAN</span><small>VIRTUAL WORKSPACE</small></button>
    <div class="core-caption"><span>ARES</span><b></b><span>LYFS</span><b></b><span>SECURE</span></div>
  </section>

  <div id="leftRail" class="node-rail left"></div><div id="rightRail" class="node-rail right"></div>
  <main id="desktopWindows" class="windows"></main>
  <div class="edge-hint leftHint">MOVE HERE<br><span>APPLICATIONS</span></div><div class="edge-hint rightHint">MOVE HERE<br><span>SYSTEM</span></div>
  <footer class="footer"><span>LYCAN OS</span><span>WINDOWS HOST</span><span>NETWORK STANDBY</span></footer>
  <div id="toastStack" class="toast-stack"></div>
</div>
<script src="renderer.js"></script></body></html>
