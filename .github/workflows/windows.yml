name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure native LYCAN
        run: cmake -S . -B build-windows -DLYCAN_HEADLESS=OFF -DLYCAN_BUILD_TESTS=ON

      - name: Build native LYCAN
        run: cmake --build build-windows --config Release --parallel

      - name: Test LYCAN
        run: ctest --test-dir build-windows -C Release --output-on-failure

      - name: Assemble installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\payload | Out-Null
          $vm = Get-ChildItem build-windows -Filter lycan-vm.exe -Recurse | Select-Object -First 1
          if (-not $vm) { throw 'lycan-vm.exe was not produced' }
          Copy-Item $vm.FullName installer\payload\lycan-vm.exe -Force
          $cli = Get-ChildItem build-windows -Filter lycan-cli.exe -Recurse | Select-Object -First 1
          if ($cli) { Copy-Item $cli.FullName installer\payload\lycan-cli.exe -Force }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile LYCAN installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\LycanOS.iss

      - name: Verify and stage installer
        shell: pwsh
        run: |
          $candidates = @()
          $candidates += @(Get-ChildItem -Path installer -Recurse -Filter 'LycanOS-Setup-*.exe' -File -ErrorAction SilentlyContinue)
          $candidates += @(Get-ChildItem -Path Output -Filter 'LycanOS-Setup-*.exe' -File -ErrorAction SilentlyContinue)
          $installer = $candidates | Select-Object -First 1
          if (-not $installer) { throw 'Inno Setup completed but no LycanOS-Setup-*.exe was found.' }
          if ($installer.Extension -ne '.exe') { throw "Installer has unexpected extension: $($installer.Extension)" }
          if ($installer.Length -le 0) { throw 'Installer exists but is empty.' }
          New-Item -ItemType Directory -Force -Path installer\artifacts | Out-Null
          $staged = Join-Path (Resolve-Path installer\artifacts) 'LycanOS-Setup-0.4.2.exe'
          Copy-Item $installer.FullName $staged -Force
          $check = Get-Item $staged
          if ($check.Length -le 0) { throw 'Staged installer is empty.' }
          Write-Host "Verified installer: $($check.FullName) ($($check.Length) bytes)"

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: LycanOS-Windows-Binaries
          path: installer\payload\*.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LycanOS-Windows-Installer
          path: installer\artifacts\LycanOS-Setup-0.4.2.exe
          if-no-files-found: error
