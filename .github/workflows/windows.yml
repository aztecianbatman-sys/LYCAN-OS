name: LYCAN Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native VM
        run: cmake -S . -B build -A x64
      - name: Build native VM
        run: cmake --build build --config Release --parallel
      - name: Run native tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build LYCAN desktop installer
        working-directory: frontend
        run: npm run build:win
      - name: Verify setup exists
        shell: powershell
        run: |
          $setup = Get-ChildItem 'frontend\dist\LYCAN-OS-*-Setup-x64.exe' | Select-Object -First 1
          if (!$setup) { throw 'LYCAN setup installer was not produced' }
      - name: Build official Store packages
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-packages | Out-Null
          .\tools\make-lypkg.ps1 -AppDirectory .\store\packages\lycan-notes -Output .\release-packages\lycan-notes-1.0.0.lypkg
          .\tools\make-lypkg.ps1 -AppDirectory .\store\packages\lycan-monitor -Output .\release-packages\lycan-monitor-1.0.0.lypkg
      - name: Upload setup installer
        uses: actions/upload-artifact@v4
        with:
          name: LYCAN-OS-Windows-x64
          path: frontend/dist/LYCAN-OS-*-Setup-x64.exe
      - name: Upload Store packages
        uses: actions/upload-artifact@v4
        with:
          name: LYCAN-Store-LYPKG
          path: release-packages/*.lypkg
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            frontend/dist/LYCAN-OS-*-Setup-x64.exe
            release-packages/*.lypkg
