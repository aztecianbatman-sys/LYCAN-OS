name: LYCAN Electron build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Electron dependencies
        working-directory: frontend
        run: npm install
      - name: Validate pure Electron runtime
        working-directory: frontend
        run: npm run check
      - name: Verify no native runtime dependency
        shell: powershell
        run: |
          $main = Get-Content frontend\main.js -Raw
          if ($main -match 'lycan-backend|spawn\(') { throw 'Native backend dependency found in Electron main process' }
          if (!(Test-Path run-lycan.bat)) { throw 'run-lycan.bat is missing' }
      - name: Package Electron app directory
        working-directory: frontend
        run: npm run package
      - name: Build official Store packages
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-packages | Out-Null
          .\tools\make-lypkg.ps1 -AppDirectory .\store\packages\lycan-notes -Output .\release-packages\lycan-notes-1.0.0.lypkg
          .\tools\make-lypkg.ps1 -AppDirectory .\store\packages\lycan-monitor -Output .\release-packages\lycan-monitor-1.0.0.lypkg
      - name: Upload pure Electron app
        uses: actions/upload-artifact@v4
        with:
          name: LYCAN-OS-Electron-Windows-x64
          path: frontend/dist/LYCAN-OS-win32-x64
      - name: Upload Store packages
        uses: actions/upload-artifact@v4
        with:
          name: LYCAN-Store-LYPKG
          path: release-packages/*.lypkg
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-packages/*.lypkg
