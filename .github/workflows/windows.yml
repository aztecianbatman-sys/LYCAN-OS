name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure native LYCAN
        run: cmake -S . -B build-windows -DLYCAN_HEADLESS=OFF -DLYCAN_BUILD_TESTS=ON

      - name: Build native LYCAN
        run: cmake --build build-windows --config Release --parallel

      - name: Test LYCAN
        run: ctest --test-dir build-windows -C Release --output-on-failure

      - name: Assemble installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\payload\store | Out-Null
          New-Item -ItemType Directory -Force -Path installer\payload\docs | Out-Null
          $vm = Get-ChildItem build-windows -Filter lycan-vm.exe -Recurse | Select-Object -First 1
          if (-not $vm) { throw 'lycan-vm.exe was not produced' }
          Copy-Item $vm.FullName installer\payload\lycan-vm.exe -Force
          $cli = Get-ChildItem build-windows -Filter lycan-cli.exe -Recurse | Select-Object -First 1
          if ($cli) { Copy-Item $cli.FullName installer\payload\lycan-cli.exe -Force }
          Copy-Item store\catalog.json installer\payload\store\catalog.json -Force
          if (Test-Path docs) { Copy-Item docs\* installer\payload\docs -Recurse -Force }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile LYCAN installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\LycanOS.iss

      - name: Verify and stage installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path installer\Output -Filter 'LycanOS-Setup-*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'No installer produced.' }
          if ($installer.Length -le 0) { throw 'Installer is empty.' }
          New-Item -ItemType Directory -Force -Path installer\artifacts | Out-Null
          $staged = Join-Path (Resolve-Path installer\artifacts) 'LycanOS-Setup-0.6.0.exe'
          Copy-Item $installer.FullName $staged -Force
          $hash = (Get-FileHash $staged -Algorithm SHA256).Hash
          "$hash  LycanOS-Setup-0.6.0.exe" | Set-Content (Join-Path (Split-Path $staged) 'SHA256SUMS.txt')
          Write-Host "Verified installer: $staged ($($installer.Length) bytes)"
          Write-Host "SHA256: $hash"

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: LycanOS-Windows-Binaries
          path: installer\payload\*.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: LycanOS-Windows-Installer
          path: installer\artifacts\*
          if-no-files-found: error
