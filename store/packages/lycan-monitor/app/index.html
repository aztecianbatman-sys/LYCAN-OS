<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LYCAN Monitor</title><style>body{margin:0;background:#070a0f;color:#eaf5ff;font:14px/1.5 Segoe UI,system-ui,sans-serif}main{max-width:980px;margin:auto;padding:30px}h1{letter-spacing:.1em}button{background:#142b3d;color:#fff;border:1px solid #37617c;border-radius:8px;padding:9px 13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.card{border:1px solid #213341;background:#0b1118;border-radius:12px;padding:16px}.label{opacity:.5;font-size:11px;letter-spacing:.14em}.value{font-size:20px;margin-top:4px;white-space:pre-line}pre{white-space:pre-wrap}</style></head><body><main><div class="label">LYCAN STORE / SYSTEM</div><h1>MONITOR</h1><button id="refresh">REFRESH TELEMETRY</button><div class="grid"><section class="card"><div class="label">MEMORY</div><div class="value" id="memory">—</div></section><section class="card"><div class="label">NETWORK</div><div class="value" id="network">—</div></section><section class="card"><div class="label">PROCESSES</div><pre class="value" id="processes">—</pre></section><section class="card"><div class="label">PACKAGES</div><pre class="value" id="packages">—</pre></section></div></main><script src="app.js"></script></body></html>
